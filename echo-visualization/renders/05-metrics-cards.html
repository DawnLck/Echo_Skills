<!-- ============================================================
  数字 · KPI 卡 + 迷你折线 + 排行条（零依赖）
  何时用：要突出的是少量关键数字、同比变化、或 5~12 项的排行。
  这类内容用图表库是过度工程——纯 HTML/SVG 更快、更稳、更好看。
  改什么：卡片的 label / 值 / delta / data-series 数组；排行条的 label 与数值。
============================================================ -->
<html style="margin:0;padding:0;">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>示例指标概览 — 按主题替换</title>
<style>
:root{
  --bg:#FBFBFA; --surface:#FFFFFF;
  --ink:#1A1A18; --ink-2:#6B6B66; --ink-3:#9D9D96;
  --line:rgba(26,26,24,.10); --line-soft:rgba(26,26,24,.055);
  --accent:#3D5A80;
  --s1:#3D5A80; --s2:#C96E4A; --s3:#5B8C6E; --s4:#8A6FA8;
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1A1A19;
    --ink:#EDEDEA; --ink-2:#A2A29B; --ink-3:#6E6E67;
    --line:rgba(237,237,234,.12); --line-soft:rgba(237,237,234,.07);
    --accent:#8FADD6;
    --s1:#8FADD6; --s2:#E8946B; --s3:#85BC9A; --s4:#B59AD1;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
.viz{font-family:var(--font);color:var(--ink);background:var(--bg);
  padding:28px 24px 22px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin:0 0 10px}
.title{font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.011em;margin:0 0 7px}
.lede{font-size:13.5px;line-height:1.62;color:var(--ink-2);margin:0 0 20px;max-width:62ch}

/* —— KPI 卡 —— */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 14px 10px}
.kpi .k-label{font-size:11px;letter-spacing:.05em;color:var(--ink-3);
  font-weight:600;margin:0 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-val{font-size:27px;line-height:1.05;font-weight:600;letter-spacing:-.02em;margin:0}
.kpi .k-val small{font-size:13px;font-weight:500;color:var(--ink-3);
  letter-spacing:0;margin-left:3px}
.kpi .k-delta{font-size:11.5px;font-weight:600;margin:7px 0 0;color:var(--ink-3)}
/* 方向色只表示涨跌方向。若下降才是好事，把 pos/neg 互换即可 */
.k-delta.pos{color:var(--s3)} .k-delta.neg{color:var(--s2)}
.spark{margin-top:9px;height:30px;line-height:0}

/* —— 排行条：名称 | 条 | 数值 三列 ——
   条单独占中间一列，最长的那根也不会顶满整行。
   （顶满整行的条会被看成分隔线，而不是数据） */
.ranks{margin:22px 0 0}
.rank{display:grid;grid-template-columns:minmax(72px,auto) minmax(90px,1fr) auto;
  gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.rank:last-child{border-bottom:0}
.rank .r-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .r-track{display:block;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.rank .r-bar{display:block;height:100%;border-radius:3px;background:var(--accent)}
.rank .r-num{font-size:13px;font-weight:600;color:var(--ink);text-align:right;min-width:52px}
.rank.muted .r-bar{background:var(--ink-3);opacity:.5}
/* 很窄时让条换到第二行。必须显式指定格位：DOM 顺序是 名称→条→数值，
   交给自动排布会把数值挤到第三行，一行变三行。 */
@media (max-width:420px){
  .rank{grid-template-columns:1fr auto;gap:5px 10px}
  .rank .r-name {grid-area:1/1/2/2}
  .rank .r-num  {grid-area:1/2/2/3}
  .rank .r-track{grid-area:2/1/3/3}
}

.foot{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:11.5px;line-height:1.6;color:var(--ink-3)}
.foot b{font-weight:600;color:var(--ink-2)}
@media (max-width:560px){.viz{padding:20px 16px 18px}.title{font-size:17px}
  .kpi .k-val{font-size:24px}}
</style>

<div class="viz">
  <p class="eyebrow">示例数据 · 概览</p>
  <h1 class="title">四项核心指标里只有留存在下滑</h1>
  <p class="lede">调用量和收入同步上升，但次周留存连续三周走低——增长来自新增，不是来自留住的人。</p>

  <div class="kpis">
    <div class="kpi">
      <p class="k-label">日调用量</p>
      <p class="k-val">1.84<small>M</small></p>
      <p class="k-delta pos">▲ 12.4% 环比</p>
      <div class="spark" style="color:var(--s1)" data-series="[112,118,121,130,128,141,152,149,163,171,178,184]"></div>
    </div>
    <div class="kpi">
      <p class="k-label">次周留存</p>
      <p class="k-val">38.2<small>%</small></p>
      <p class="k-delta neg">▼ 4.1pt 环比</p>
      <div class="spark" style="color:var(--s2)" data-series="[47,46,47,45,44,44,43,42,41,40,39,38]"></div>
    </div>
    <div class="kpi">
      <p class="k-label">平均时延</p>
      <p class="k-val">214<small>ms</small></p>
      <p class="k-delta pos">▼ 8.0% 环比</p>
      <div class="spark" style="color:var(--s3)" data-series="[268,261,255,249,247,238,236,228,225,219,216,214]"></div>
    </div>
    <div class="kpi">
      <p class="k-label">月度收入</p>
      <p class="k-val">¥426<small>K</small></p>
      <p class="k-delta pos">▲ 6.8% 环比</p>
      <div class="spark" style="color:var(--s4)" data-series="[322,331,340,338,352,361,370,382,391,404,415,426]"></div>
    </div>
  </div>

  <div class="ranks">
    <p class="eyebrow" style="margin:0 0 4px">按渠道拆解调用量</p>
    <!-- r-bar 的 width 就是占比，直接写百分比，不需要脚本 -->
    <div class="rank"><span class="r-name">开放 API</span><span class="r-track"><i class="r-bar" style="width:100%"></i></span><span class="r-num">742K</span></div>
    <div class="rank"><span class="r-name">移动端 SDK</span><span class="r-track"><i class="r-bar" style="width:70%"></i></span><span class="r-num">519K</span></div>
    <div class="rank"><span class="r-name">网页嵌入</span><span class="r-track"><i class="r-bar" style="width:45%"></i></span><span class="r-num">331K</span></div>
    <div class="rank muted"><span class="r-name">内部工具</span><span class="r-track"><i class="r-bar" style="width:20%"></i></span><span class="r-num">148K</span></div>
    <div class="rank muted"><span class="r-name">其他</span><span class="r-track"><i class="r-bar" style="width:13%"></i></span><span class="r-num">98K</span></div>
  </div>

  <p class="foot"><b>数据</b>：示例数据，非真实业务数字 · <b>口径</b>：近 12 周，周粒度</p>
</div>

<script>
// 迷你折线：按容器实际像素宽度生成，避免 preserveAspectRatio 拉伸把线和端点压变形。
// 数字和涨跌都写在 HTML 里，所以脚本不执行时卡片依然完整可读。
(function(){
  function draw(el){
    var d; try{ d = JSON.parse(el.dataset.series); }catch(e){ return; }
    if(!d || d.length < 2) return;
    var w = el.clientWidth || 140, h = 30, p = 3;
    var lo = Math.min.apply(null,d), hi = Math.max.apply(null,d), span = (hi-lo)||1;
    var X = function(i){ return p + i*(w-2*p)/(d.length-1); };
    var Y = function(v){ return h-p - (v-lo)/span*(h-2*p); };
    var line = d.map(function(v,i){ return (i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
    var area = line+' L'+X(d.length-1).toFixed(1)+','+h+' L'+X(0).toFixed(1)+','+h+' Z';
    el.innerHTML =
      '<svg width="'+w+'" height="'+h+'" aria-hidden="true">'+
        '<path d="'+area+'" fill="currentColor" opacity=".10"/>'+
        '<path d="'+line+'" fill="none" stroke="currentColor" stroke-width="1.5" '+
              'stroke-linejoin="round" stroke-linecap="round"/>'+
        '<circle cx="'+X(d.length-1).toFixed(1)+'" cy="'+Y(d[d.length-1]).toFixed(1)+'" '+
                'r="2.4" fill="currentColor"/>'+
      '</svg>';
  }
  function all(){ [].forEach.call(document.querySelectorAll('.spark'), draw); }
  all();
  var t; addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(all, 120); });
})();
</script>
</html>
